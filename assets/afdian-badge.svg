<svg xmlns="http://www.w3.org/2000/svg" width="206" height="44" viewBox="0 0 206 44" fill="none" role="img" aria-label="Sponsor Cockpit Glass on Afdian">
  <title>Sponsor Cockpit Glass on Afdian</title>
  <defs>
    <linearGradient id="af-bg" x1="0" y1="0" x2="206" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#252936"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <radialGradient id="af-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(24 22) rotate(12) scale(76 34)">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="af-rim" x1="103" y1="0.75" x2="103" y2="43.25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="af-icon-bg" x1="10" y1="8" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Tactile obsidian-glass pill -->
  <rect x="0.75" y="0.75" width="204.5" height="42.5" rx="12" fill="url(#af-bg)"/>
  <rect x="0.75" y="0.75" width="204.5" height="42.5" rx="12" fill="url(#af-glow)"/>
  <rect x="0.75" y="0.75" width="204.5" height="42.5" rx="12" stroke="url(#af-rim)" stroke-width="1.2"/>

  <!-- Luminous violet spark badge -->
  <rect x="9" y="9" width="26" height="26" rx="7.5" fill="url(#af-icon-bg)"/>
  <rect x="9.5" y="9.5" width="25" height="25" rx="7" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1"/>
  <path d="M23.6 14.4L17.2 22.5H21.5L20.4 29.6L26.8 21.5H22.5L23.6 14.4Z" fill="#ffffff"/>

  <!-- Crisp label -->
  <text x="45" y="22.5" fill="#f3f4f8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" letter-spacing="-0.1" dominant-baseline="central">Sponsor on Afdian</text>

  <!-- Subtle right chevron -->
  <path d="M182 17.5L186.5 22L182 26.5" stroke="#ffffff" stroke-opacity="0.48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
